const TECH = [

const STARYARDS=[
  {name:"Deimos Staryards Inc.",color:"#4a8ef0",sector:"Staryard",hq:"Deimos Orbital / Cydonia, Mars",founded:"2089",alignment:"UC",status:"active",employees:"~680K",history:"Founded by Theron Mace and the Deimos Industrial Consortium as an orbital fabrication platform above Mars' moon, initially constructing habitat modules for the Mars expansion. Pivoted to full starship construction when grav drive technology made orbital shipbuilding economically viable. Became the UC's primary military shipbuilder after the Narion War and has held that position ever since.",products:"Armored transports, UC military vessels, bulkhead-heavy freighters. Full in-house hab, cockpit, landing gear, and structural modules. Military styling dominates — angular, dense, built to absorb punishment. Named ship classes include the Abyss Trekker, Renegade, Privateer, and the base hull of the UC Vigilance class.",note:"Officially UC-exclusive on military contracts but civilian models are available. The Cydonia engineering facility is where grav drive integration was perfected for mass-production vessels. Considered the most historically significant active shipyard in the Settled Systems.",subs:["Deimos Military Division","Deimos Commercial","Cydonia Engineering Works"]},
  {name:"HopeTech",color:"#c06030",sector:"Staryard",hq:"Hopetown, Polvo, Valo System",founded:"2198",alignment:"Freestar",status:"active",employees:"~310K",history:"Founded by Enid Hopewell, a Freestar Collective logistics coordinator who saw that the colony era's bottleneck was not military ships but supply chain vessels. Built the first HopeTech facility on Polvo from salvaged Nova Galactic components, deliberately choosing a Freestar frontier world to signal independence from UC industrial dominance.",products:"Utility and logistics vessels — 'space trucks' is accurate and Enid embraced it. Modular habs, large cargo capacity, robust but unglamorous. Known ship lines include the Wanderwell, Strongbox, Drifter, and the base Frontier hull used by many Freestar Rangers.",note:"Spiritually the Freestar Collective's shipyard but explicitly independent. The phrase 'it's a HopeTech' is frontier shorthand for a ship that runs forever and never looks good doing it. Acquisition approaches have been firmly declined.",subs:["HopeTech Cargo Division","HopeTech Components","Polvo Assembly Works"]},
  {name:"Nova Galactic",color:"#888888",sector:"Staryard",hq:"Nova Galactic Staryard, Luna Orbit (CLOSED)",founded:"2118",alignment:"Defunct",status:"defunct",employees:"N/A — liquidated 2295",history:"The first civilian spaceflight corporation of true global scale, founded as a joint venture between the European Space Agency's commercial division, JAXA's private spinoff Galactic Horizon, and American aerospace giant Meridian Launch Systems. Partnered with NASA in 2138 to co-develop the grav drive prototype. At their peak, Nova Galactic employed over 4 million people across 11 facilities. Went bankrupt in 2295.",products:"The original complete ship manufacturer. Produced the NG Grav Drive series — the first commercial grav drives in history — and exclusively used Reladyne sublight engines. Known hulls: Nova Scout, Wanderer, Discovery-class, Legacy-class freighter, and the ECS Constant generation ship.",note:"Revered as vintage by enthusiasts and cursed by mechanics. The NG Grav Drive is a historical artifact that still works. Nova Galactic components turn up everywhere. Their Luna Orbital shipyard is a protected historical site. The IP was purchased by a holding company whose majority stakeholder has never been publicly identified.",subs:["NG Grav Drive (legacy)","Nova Scout (legacy hull)","ECS Constant (historical)"]},
  {name:"Eklund Staryards",color:"#d0a060",sector:"Staryard",hq:"Londinion, Toliman II, Toliman System",founded:"2201",alignment:"Independent",status:"active",employees:"~28K",history:"Founded by Björn Eklund, a Swedish industrial designer who believed the evacuation era's utilitarian shipbuilding had 'forgotten that humans need beauty to survive.' Relocated to Toliman II, where the British Monarchy's descendants had established Londinion. Björn's granddaughter Issa Eklund currently serves as chief design officer — unmarried, running the company her grandfather built, and making it clear to all potential suitors that the company comes first.",products:"Luxury interiors, premium cockpit modules, high-grade hab configurations. Ships that look like moving architecture. Current lines include the Crescendo, Meridian Executive, Solaris Yacht, and Diplomat-class.",note:"The Stroud-Eklund merger that industry analysts keep predicting has not happened. Issa has shown no interest in Walter Stroud's overtures, professional or otherwise. The company has a significant event coming that hasn't happened yet — one that will affect Londinion itself.",subs:["Eklund Luxury Hulls","Eklund Interior Systems","Londinion Design Studio"]},
  {name:"Taiyo Astroneering",color:"#e060c0",sector:"Staryard",hq:"Neon, Volii Alpha (now Ryujin Tower)",founded:"2261",alignment:"Ryujin / Independent",status:"active — Ryujin subsidiary Jan 2310",employees:"~195K",history:"Founded by Kenji Nakamura and Priya Osei as an instrumentation and precision engineering firm. Their philosophy: a ship should feel like an extension of the pilot's body. Acquired by Ryujin Industries in January 2310. The ink is barely dry.",products:"State-of-the-art cockpits, premium habs, precision landing gear. Every component engineered to tolerances tighter than competitors. Known ship lines include the Kepler R, Kepler S, Wanderstar, and Astraia. Considered by many the perfect marriage of instrumentation, form, and function.",note:"The acquisition is controversial internally. Taiyo's independent engineering culture and Ryujin's corporate structure are already clashing. Several senior engineers submitted resignation notices within the first two weeks.",subs:["Taiyo Precision Engineering","Taiyo Cockpit Systems","Taiyo Hull Division"]},
  {name:"Vanguard Craftworks",color:"#604040",sector:"Staryard",hq:"Gagarin Landing, Gagarin, Alpha Centauri",founded:"2185",alignment:"UC (failing)",status:"dying",employees:"~18K",history:"Started as a UC veteran cooperative — pilots who survived the Narion War pooling their hazard pay to build ships they wished they'd had. Now being squeezed out between Deimos's military contracts above and Taiyo's civilian premium market below. Projected closure 2318.",products:"Mid-weight patrol vessels, armed courier ships. The Sentinel-class patrol and Courier Mk.III remain in service on UC frontier worlds.",note:"The Colony War is their last real opportunity and they know it. UC has been slow-walking their military contracts.",subs:["Vanguard Patrol Division","Vanguard Courier Works"]},
  {name:"Cascadia Shipworks",color:"#604040",sector:"Staryard",hq:"Narion System (orbital facility)",founded:"2220",alignment:"Independent (failing)",status:"dying",employees:"~12K",history:"Founded to build reconstruction ships after the Narion War. Had a 30-year golden era as the Settled Systems rebuilt. That era is over, but they have developed very significant good will and cultural capital amongst the citizens of the Settled Systems as an impartial relief aid organization. Projected closure 2325.",products:"Habitat transport vessels, survey scouts, agricultural platforms. Excellent for what they do. The problem is demand has dried up.",note:"Considering a merger with HopeTech but Enid Hopewell's grandchildren are resistant to diluting the brand.",subs:["Cascadia Habitat Division","Cascadia Survey Works"]},
  {name:"Meridian Heavy Industries",color:"#604040",sector:"Staryard",hq:"Deimos Orbital (rented space)",founded:"2165",alignment:"UC (contract dispute)",status:"dying",employees:"~8K",history:"Once a significant UC military shipbuilder. When UC consolidated all military contracts with Deimos after the Narion War, Meridian lost 80% of their revenue overnight. Projected bankruptcy 2312.",products:"Large military transports, troop carriers, supply barges. The Warhorse Transport and Bulwark Supply Barge remain in service.",note:"Their lawyers are in active dispute with UC procurement over non-payment on three vessels. There is no path where Meridian Heavy Industries exists in 2320.",subs:["Meridian Heavy Transport","Meridian Supply Barges"]},

const PARTS=[
  {name:"Amun Dunn",color:"#d08020",sector:"Parts — Engines",hq:"Jemison, Alpha Centauri",founded:"2178",alignment:"Neutral",status:"active",employees:"~340K",history:"The Amun Corporation (Egyptian engineering firm, named for the hidden god) merged with the Dunn Propulsion Company (British sublight engineering, founded by Veronica Dunn) in 2178. Both independently improved on the Demon-Core Engine blueprint demonstrated in 2141. Their merger created the dominant sublight engine manufacturer of the 23rd century.",products:"Amun series engines (standard), Dunn series (efficiency-optimized), Amun Dunn X series (high-performance). The X series is the current performance benchmark.",note:"The Demon-Core Engine blueprint — demonstrated 2141 — is the sublight drive of the 24th century. The X series outperforms Reladyne's White Dwarf line at full burn but consumes He-3 at a higher rate.",subs:["Amun Engine Series","Dunn Engine Series","Amun Dunn X Series"]},
  {name:"Dogstar R&D",color:"#4a8ef0",sector:"Parts — Reactors / Shields / Fuel",hq:"Wolf System Research Platform",founded:"2209",alignment:"UC (military contract)",status:"active",employees:"~18K",history:"Named for Sirius, the 'Dog Star.' Founded as a pure UC military research division following the Narion War. The Wolf system was deliberately chosen — uninhabitable and hazardous, an ideal isolated research environment.",products:"Toroidal reactors, Inertial reactors, He-3 fuel tank designs, and shield generators. Their shield tech is considered the most advanced in the Settled Systems but rarely reaches the civilian market in full specification.",note:"Technically a private company with an exclusive UC military contract. Their He-3 tank designs are the basis for the Nautilus Titan series, though Dogstar receives no royalty.",subs:["Dogstar Reactor Division","Dogstar Shield Research","Dogstar Fuel Systems"]},
  {name:"Horizon Defense",color:"#8080ff",sector:"Parts — Weapons",hq:"Gagarin Landing, Gagarin, Alpha Centauri",founded:"2152",alignment:"UC",status:"active",employees:"~290K",history:"Emerged from the merger of Williams Ballistics (Cardiff, Wales) and Aerospace Defense Systems (Bristol) during the evacuation era. Relocated to Gagarin in 2161. Technically UC-aligned but old enough that Freestar vessels and Crimson Fleet ships run Horizon weapons without anyone raising an eyebrow.",products:"Marauder Railgun, Disruptor Beam, Dragon Pulse Laser, Mauler Autocannon. The Mauler Autocannon is the workhorse of mid-weight ship combat. The Dragon Pulse Laser is their prestige product.",note:"Welsh and proud of it — the Gagarin facility has a Saint David's Day tradition that has run unbroken since 2161. When a weapon outlives the company that sells it, it becomes infrastructure. Horizon Defense is infrastructure.",subs:["Marauder Ballistics","Horizon Energy Weapons","Horizon Defense Turrets"]},
  {name:"Light Scythe Technologies Inc.",color:"#e0a020",sector:"Parts — Weapons (Energy)",hq:"Montara Luna, Cheyenne System",founded:"2195",alignment:"Freestar",status:"active",employees:"~180K",history:"Founded by Alejandro Vega Ruiz and engineers from Mexico's aerospace sector. Deliberately chose Freestar space — specifically Montara Luna — as a statement of political independence that has never wavered.",products:"Atlatl Missile Launcher series, Blaze Laser series, Firebolt / Fulminator / Spark suppressor series, Scord laser turret series.",note:"Light Scythe has never taken a UC military contract by explicit company policy. The Freestar Rangers consider the Atlatl series standard equipment.",subs:["Atlatl Ordnance","Blaze Laser Division","Scord Turret Systems"]},
  {name:"Nautilus Shielding",color:"#40d0a0",sector:"Parts — Shields / Fuel Tanks",hq:"Independent Station, Narion System",founded:"2180",alignment:"Independent",status:"active",employees:"~160K",history:"Founded by the Papadimitriou family from Athens as a reaction against UC-aligned monopolization of military shield tech. Named for the nautilus shell — nature's perfect pressure vessel. Deliberately headquartered outside both UC and Freestar controlled space.",products:"Titan He-3 tank series, Bastille / Tower / Fortress shield generator series. The Fortress series is the premium civilian shield. Found everywhere because they sell to everyone.",note:"One of the genuinely neutral companies. They have a quiet side business supplying both sides of every conflict through intermediaries. The Papadimitriou family's neutrality is a commercial position as much as a moral one.",subs:["Titan Fuel Systems","Bastille Shield Division","Fortress Premium Series"]},
  {name:"Protectorate Systems",color:"#e0a020",sector:"Parts — Shields / Cargo",hq:"Akila City, Cheyenne System",founded:"2148",alignment:"Freestar",status:"active",employees:"~210K",history:"Born from the merger of Texas Instruments' defense division, two Georgia-based aerospace firms, and a South Carolina shield engineering company. The Texas Instruments DNA shows in their obsession with miniaturization. Now the oldest continuous tech company in the Freestar Collective.",products:"Marduk / Odin / Osiris shield generator series, Caravel / Galleon shielded cargo hold series. Protectorate cargo holds predate the Freestar Collective itself.",note:"'We went from calculators to warship shields.' The Galleon series cargo holds are the most copied design in the Settled Systems, to Protectorate's ongoing legal frustration.",subs:["Marduk Shield Division","Protectorate Cargo Systems","Osiris Premium Series"]},
  {name:"Reladyne",color:"#f0d040",sector:"Parts — Engines / Grav Drives",hq:"Jemison, Alpha Centauri",founded:"2061",alignment:"Neutral",status:"active",employees:"~890K",history:"The oldest surviving tech company in the Settled Systems — technically predating the Incident of 2057. Florida-based from the Kennedy Space Center era. THE fuel system supplier for Nova Galactic's entire product line. Their R-1000 Alpha Grav Drive was the first commercial alternative to the NG Grav Drive.",products:"White Dwarf engine series (oldest commercial sublight), R-1000 Alpha Grav Drive series, various legacy systems still running on ships a century old.",note:"Reladyne is what happens when a company outlives its dominant market position and just keeps going anyway. 'If it still runs, it's probably Reladyne' is a common expression throughout the Settled Systems.",subs:["White Dwarf Engines","R-1000 Grav Drive Series","Reladyne Legacy Parts"]},
  {name:"Panoptes",color:"#d060a0",sector:"Parts — Engines",hq:"Akila City (secondary campus), Cheyenne System",founded:"2175",alignment:"Neutral",status:"active",employees:"~420K",history:"The merger of Fincantieri, Arianespace, and a Swiss precision engineering firm. Named for the all-seeing giant of Greek myth. Second headquarters on Akila chosen to access Freestar markets without political alignment.",products:"Ares engine series (standard), Hercules series (heavy duty), Poseidon series (deep space endurance). The Poseidon is the preferred engine for long-haul deep space runs.",note:"Many fleets run this line of engines — the deep space endurance characteristics match many people's operational profile perfectly. The Hercules series is the preferred choice for heavy freight operators.",subs:["Ares Engine Division","Hercules Heavy Series","Poseidon Deep Space"]},

const ALL=[...FOOD,...TECH,...MINING];
const ALL_COMBINED=[...FOOD,...TECH,...MINING,...STARYARDS,...PARTS];

// ── HELPERS ───────────────────────────────────────────────────────────────────

function pill(text,color){return `<span class="pill" style="background:${color}22;color:${color};border:1px solid ${color}55">${esc(text)}</span>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function logoCell(name){const n=esc(name);return `<td class="logo-cell"><img src="logos/${n}_Logo.svg" alt="${n} logo" onerror="this.src='logos/${n}_Logo.webp';this.onerror=function(){this.style.display='none'};"></td>`;}
function alignColor(a){if(!a)return'#6a738a';if(a.includes('UC'))return'#4a8ef0';if(a.includes('Freestar')||a.includes('FC'))return'#e0a020';if(a.includes('Trans')||a.includes('All'))return'#e05050';if(a.includes('Elite')||a.includes('Wealthy'))return'#d0b030';if(a.includes('Non-Settled'))return'#3a4055';if(a.includes('Ryujin'))return'#e060c0';if(a.includes('Defunct')||a.includes('defunct'))return'#808080';return'#60b0c0';}
function statusBadge(s){if(!s)return'';if(s.includes('dying'))return`<span class="status-badge dying">DECLINING</span>`;if(s.includes('defunct'))return`<span class="status-badge defunct">DEFUNCT</span>`;return`<span class="status-badge active-badge">ACTIVE</span>`;}

// ── DETAIL PANEL ─────────────────────────────────────────────────────────────
// onClose = true renders the collapse button (wired after insertion)

function renderDetail(corp, withClose) {
  if(!corp) return '';
  const c = corp.color || '#4af0a0';
  const ac = alignColor(corp.alignment);
  const closeBtn = withClose
    ? `<button class="detail-close" id="dr-close-btn">✕ collapse</button>`
    : '';
  return `
  <div class="detail" style="border-color:${c}44">
    ${closeBtn}
    <div class="detail-header">
      <img src="logos/${esc(corp.name)}_Logo.svg" alt="${esc(corp.name)} logo"
        class="detail-logo"
        onerror="this.src='logos/${esc(corp.name)}_Logo.webp';this.onerror=function(){this.style.display='none'};">
      <div class="detail-name" style="color:${c}">${esc(corp.name)}</div>
      ${pill(corp.sector, c)}
      ${pill(corp.alignment||'Independent', ac)}
      ${corp.status ? statusBadge(corp.status) : ''}
    </div>
    <div class="detail-meta">
      <div class="detail-meta-item"><div class="key">HQ</div><div class="val">${esc(corp.hq)}</div></div>
      <div class="detail-meta-item"><div class="key">Founded</div><div class="val">${esc(corp.founded)}</div></div>
      <div class="detail-meta-item"><div class="key">Alignment</div><div class="val">${esc(corp.alignment||'Independent')}</div></div>
      ${corp.employees?`<div class="detail-meta-item"><div class="key">Est. Employees</div><div class="val">${esc(corp.employees)}</div></div>`:''}
    </div>
    ${corp.history?`<div class="detail-section-label">Corporate History</div><div class="detail-text">${esc(corp.history)}</div>`:''}
    ${corp.products?`<div class="detail-section-label">Products / Services</div><div class="detail-text">${esc(corp.products)}</div>`:''}
    ${corp.note?`<div class="detail-note">${esc(corp.note)}</div>`:''}
    ${corp.subs&&corp.subs.length?`<div class="detail-subs"><span class="detail-subs-label">Subsidiaries / Product Lines:</span> ${corp.subs.map(s=>pill(s,c)).join(' ')}</div>`:''}
  </div>`;
}

// ── INLINE EXPAND ─────────────────────────────────────────────────────────────
// Inserts a <tr class="detail-row"> directly after the clicked row.
// Second click on same row collapses it. ✕ button also collapses.

function removeDetailRow(tbody) {
  tbody.querySelectorAll('tr.detail-row').forEach(r => r.remove());
}

function injectDetailRow(tbody, clickedTr, corp, state, stateKey) {
  removeDetailRow(tbody);
  state[stateKey] = clickedTr;
  clickedTr.classList.add('selected');

  const colCount = clickedTr.querySelectorAll('td').length;
  const expandTr = document.createElement('tr');
  expandTr.className = 'detail-row';
  const td = document.createElement('td');
  td.colSpan = colCount;
  td.innerHTML = renderDetail(corp, true);
  expandTr.appendChild(td);
  clickedTr.after(expandTr);

  const closeBtn = expandTr.querySelector('#dr-close-btn');
  if(closeBtn) closeBtn.addEventListener('click', e => {
    e.stopPropagation();
    removeDetailRow(tbody);
    clickedTr.classList.remove('selected');
    state[stateKey] = null;
  });
}

// ── CORP LIST ─────────────────────────────────────────────────────────────────

function renderCorpList(corps, color, containerId, showStatus) {
  const btnId = containerId + '-btns';
  const tableId = containerId + '-table';
  const statusCol = showStatus ? '<th>Status</th>' : '';
  const btns = corps.map((c,i) =>
    `<button class="corp-btn" data-idx="${i}" style="color:${c.color||color}">${esc(c.name)}</button>`
  ).join('');
  const rows = corps.map((c,i) => `
    <tr class="clickable ${i%2===0?'even':'odd'}" data-idx="${i}">
      <td style="color:${c.color||color}">${esc(c.name)}</td>
      <td>${pill(c.sector, c.color||color)}</td>
      ${showStatus ? `<td>${statusBadge(c.status||'active')}</td>` : ''}
      <td style="color:#6a738a;font-size:10px">${esc(c.hq)}</td>
      <td style="font-family:'Courier New',monospace;font-size:11px">${esc(c.founded)}</td>
      <td style="color:#6a738a;font-size:10px">${esc(c.employees||'—')}</td>
      ${logoCell(c.name)}
    </tr>`).join('');
  return `
    <div class="corp-btn-grid" id="${btnId}">${btns}</div>
    <table>
      <thead><tr><th>Company</th><th>Sector</th>${statusCol}<th>HQ</th><th>Founded</th><th>Employees</th><th style="text-align:center">Logo</th></tr></thead>
      <tbody id="${tableId}">${rows}</tbody>
    </table>`;
}

// ── CORP LIST EVENTS ──────────────────────────────────────────────────────────

const listState = {};   // { containerId: selectedTr | null }

function attachCorpListEvents(corps, containerId) {
  const btnGrid = document.getElementById(containerId + '-btns');
  const tbody   = document.getElementById(containerId + '-table');
  if(!btnGrid || !tbody) return;
  if(!(containerId in listState)) listState[containerId] = null;

  function syncBtns(selIdx) {
    btnGrid.querySelectorAll('.corp-btn').forEach((b, i) => {
      const on = (i === selIdx);
      b.classList.toggle('active', on);
      b.style.background = on ? (corps[i].color||'#4af0a0')+'33' : 'transparent';
      b.style.borderColor = on ? (corps[i].color||'#4af0a0') : '#1e2330';
      b.style.color = corps[i].color || '#6a738a';
    });
  }

  function select(idx, tr) {
    const prevTr = listState[containerId];
    const prevIdx = prevTr ? parseInt(prevTr.dataset.idx) : -1;
    if(prevIdx === idx) {
      // Collapse
      removeDetailRow(tbody);
      prevTr.classList.remove('selected');
      listState[containerId] = null;
      syncBtns(-1);
    } else {
      // Expand inline
      syncBtns(idx);
      injectDetailRow(tbody, tr, corps[idx], listState, containerId);
      // Override the close button to also reset btn styles
      const expandTr = tr.nextElementSibling;
      if(expandTr && expandTr.classList.contains('detail-row')) {
        const cb = expandTr.querySelector('#dr-close-btn');
        if(cb) cb.addEventListener('click', () => syncBtns(-1), {once:true});
      }
    }
  }

  btnGrid.querySelectorAll('.corp-btn').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      const tr = tbody.querySelector(`tr[data-idx="${i}"]`);
      if(tr) select(i, tr);
    });
  });

  tbody.addEventListener('click', e => {
    const tr = e.target.closest('tr[data-idx]');
    if(!tr) return;
    if(e.target.closest('.detail-close, #dr-close-btn')) return;
    select(parseInt(tr.dataset.idx), tr);
  });
}

// ── ALL CORPS ─────────────────────────────────────────────────────────────────

let allFilter = 'All';
let allSearch = '';
const allState = { sel: null };

function renderAllRows() {
  const tbody = document.getElementById('all-tbody');
  if(!tbody) return;
  const filtered = ALL_COMBINED.filter(c => {
    const ms = !allSearch ||
      c.name.toLowerCase().includes(allSearch.toLowerCase()) ||
      c.hq.toLowerCase().includes(allSearch.toLowerCase());
    let mf = true;
    if(allFilter !== 'All') {
      if(allFilter === 'Dying') mf = c.status && c.status.includes('dying');
      else mf = c.sector.toLowerCase().includes(allFilter.toLowerCase()) ||
        (c.alignment && c.alignment.toLowerCase().includes(allFilter.toLowerCase()));
    }
    return ms && mf;
  });
  tbody._filtered = filtered;
  allState.sel = null;
  tbody.innerHTML = filtered.map((c,i) => {
    const ac = alignColor(c.alignment);
    return `<tr class="clickable ${i%2===0?'even':'odd'}" data-all-idx="${i}">
      <td style="color:${c.color||'#4af0a0'}">${esc(c.name)}</td>
      <td>${pill(c.sector, c.color||'#4af0a0')}</td>
      <td>${statusBadge(c.status||'active')}</td>
      <td>${pill((c.alignment||'Ind.').split(' ')[0], ac)}</td>
      <td style="color:#6a738a;font-size:10px">${esc(c.hq)}</td>
      <td style="font-family:'Courier New',monospace;font-size:11px">${esc(c.founded)}</td>
      ${logoCell(c.name)}
    </tr>`;
  }).join('');
}

function attachAllEvents() {
  const input = document.getElementById('search-input');
  if(input) {
    input.value = allSearch;
    input.addEventListener('input', e => { allSearch=e.target.value; allState.sel=null; renderAllRows(); attachAllTableClick(); });
  }
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      allFilter = btn.dataset.filter;
      allState.sel = null;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderAllRows();
      attachAllTableClick();
    });
  });
  attachAllTableClick();
}

function attachAllTableClick() {
  const tbody = document.getElementById('all-tbody');
  if(!tbody) return;
  tbody.onclick = e => {
    const tr = e.target.closest('tr[data-all-idx]');
    if(!tr) return;
    if(e.target.closest('.detail-close, #dr-close-btn')) return;
    const idx = parseInt(tr.dataset.allIdx);
    const corp = (tbody._filtered || ALL_COMBINED)[idx];
    if(!corp) return;
    const prevTr = allState.sel;
    const prevIdx = prevTr ? parseInt(prevTr.dataset.allIdx) : -1;
    if(prevIdx === idx) {
      removeDetailRow(tbody);
      prevTr.classList.remove('selected');
      allState.sel = null;
    } else {
      injectDetailRow(tbody, tr, corp, allState, 'sel');
    }
  };
}

    <table>
      <thead><tr><th>Region / System</th><th>Major Corporate Presence</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr class="${i%2===0?'even':'odd'}"><td style="color:${r.col};font-size:12px">${esc(r.r)}</td><td class="geo-corps">${esc(r.c)}</td></tr>`).join('')}</tbody>
    </table>`;
}

function pageAll() {
  return `
    <div class="sh" style="color:#f0a04a">Full Corporate Registry — All Sectors</div>
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search by name or HQ...">
      ${['All','Food','Tech','Mining','Staryard','Parts','Pharma','Luxury','Weapons','Dying'].map(s=>`<button class="filter-btn${s==='All'?' active':''}" data-filter="${s}">${s}</button>`).join('')}
    </div>
    <table>
      <thead><tr><th>Company</th><th>Sector</th><th>Status</th><th>Alignment</th><th>HQ</th><th>Founded</th><th style="text-align:center">Logo</th></tr></thead>
      <tbody id="all-tbody"></tbody>
    </table>`;
}

// ── TAB SYSTEM ────────────────────────────────────────────────────────────────

let currentTab = 'overview';

function setTab(tab) {
  currentTab = tab;
  const tabColors={overview:'#4af0a0',food:'#60c860',tech:'#c060d0',mining:'#c08040',staryards:'#4a8ef0',parts:'#d08020',all:'#f0a04a',geo:'#60b0c0'};
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const isActive = btn.dataset.tab === tab;
    const col = tabColors[tab]||'#4af0a0';
    btn.classList.toggle('active', isActive);
    if(isActive){btn.style.background=col;btn.style.color='#0a0c10';btn.style.borderColor=col;}
    else{btn.style.background='transparent';btn.style.color='#6a738a';btn.style.borderColor='#1e2330';}
  });
  const content = document.getElementById('content');
  let html='';
  if     (tab==='overview')  html=pageOverview();
  else if(tab==='food')      html=`<div class="sh" style="color:#60c860">Food &amp; Beverage Corporations — 2310</div>`+renderCorpList(FOOD,'#60c860','food',false);
  else if(tab==='tech')      html=`<div class="sh" style="color:#c060d0">Technology, Research &amp; Medical Corporations — 2310</div>`+renderCorpList(TECH,'#c060d0','tech',false);
  else if(tab==='mining')    html=`<div class="sh" style="color:#c08040">Mining &amp; Extraction Corporations — 2310</div>`+renderCorpList(MINING,'#c08040','mining',false);
  else if(tab==='staryards') html=`<div class="sh" style="color:#4a8ef0">Staryard Companies — 2310</div>`+renderCorpList(STARYARDS,'#4a8ef0','staryards',true);
  else if(tab==='parts')     html=`<div class="sh" style="color:#d08020">Ship Part Manufacturers — 2310</div>`+renderCorpList(PARTS,'#d08020','parts',true);
  else if(tab==='all')       html=pageAll();
  else if(tab==='geo')       html=pageGeo();
  html+=`<div id="footer">CLASSIFICATION: TROPOSPHERE MULTIVERSE PROJECT — CLOUDHEARTV CAMPAIGN DOCUMENT — STARFIELD: RELICS <p>Updated Logo Graphics for Kore Kinetics, Six Sisters Mining, Deimos, Erdebrau, and Eklund by jasdonle on Reddit</p><p>Aldebaran Logo Graphics based on the <i>Les Mondes d'Aldébaran</i> science-fiction comic series written and illustrated by Léo and published by Dargaud (French) and Cinebook (English)</p><p>AmazDoom font used in Meridian Heavy Industries as a Reference by AmazingMax under Creative Commons Attribution-Noncommercial 3.0. Doom is a property of id Software, Inc., a subsidiary of ZeniMax Media and Microsoft.</p></div>`;
  content.innerHTML=html;
  if     (tab==='food')      attachCorpListEvents(FOOD,'food');
  else if(tab==='tech')      attachCorpListEvents(TECH,'tech');
  else if(tab==='mining')    attachCorpListEvents(MINING,'mining');
  else if(tab==='staryards') attachCorpListEvents(STARYARDS,'staryards');
  else if(tab==='parts')     attachCorpListEvents(PARTS,'parts');
  else if(tab==='all')       { renderAllRows(); attachAllEvents(); }
}

document.getElementById('tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if(btn) setTab(btn.dataset.tab);
});

setTab('overview');
</script>
</body>
</html>
