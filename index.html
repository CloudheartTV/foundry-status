<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Airing - FoundryVTT</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background-color: #ffffff;
      color: #333333;
      margin: 0;
      padding: 0;
    }
    /* Dark Mode Styles */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #f0f0f0;
      }
    
      .status-container {
        background-color: #1e1e1e;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      }
      .online {
        background-color: #103820; /* Darker green shade */
        box-shadow: 0 0 20px rgba(0, 255, 127, 0.4);
      }
    
      .offline {
        background-color: #381010; /* Dark red background */
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      }
    
      /* Invert all target images */
      .invert-on-dark {
        filter: invert(1) hue-rotate(180deg);
      }
    
      /* Optional: make links and icons stand out */
      #social-links a img {
        filter: invert(1) grayscale(100%) !important;
      }
    
      #logo:hover {
        filter: invert(1) hue-rotate(180deg) brightness(1.2);
      }
    
      a {
        color: #90caf9;
      }
    }
    #now-airing {
      padding-top: 60px;
    }

    .status-container {
      background-color: #e6e6e6;
      border-radius: 15px;
      margin: 20px auto;
      max-width: 600px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .online {
      box-shadow: 0 0 15px rgba(0, 255, 127, 0.7);
    }

    .offline {
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
    }

    .status-image {
      width: 250px;
      height: 250px;
      object-fit: contain;
    }

    .status-text {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    /* === Logo Styling === */
    #logo-wrapper {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
    }

    #logo {
      width: 240px;
      transition: width 0.3s ease-in-out, transform 0.3s ease-in-out;
    }

    #logo:hover {
      transform: scale(1.2);
    }

    /* === Social Links === */
    #social-links {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }

    #social-links a {
      width: 40px;
      height: 40px;
      display: inline-block;
      transition: transform 0.3s ease-in-out;
    }

    #social-links a img {
      width: 100%;
      height: auto;
      filter: grayscale(100%);
      transition: filter 0.3s ease-in-out;
    }

    #social-links a:hover {
      transform: scale(1.2);
    }

    #social-links a:hover img {
      filter: grayscale(0%);
    }

    /* === Responsive Mobile Layout === */
    @media (max-width: 800px) {
      #logo-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
        margin: 20px auto 10px auto;
        top: 0;
        left: 0;
      }

      #logo {
        width: 160px;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Wrapped logo for responsive positioning -->
  <div id="logo-wrapper">
    <img id="logo" class="invert-on-dark" src="creator_logo.png" alt="Creator Logo">
  </div>

  <div id="now-airing">
    <h1 id="now-airing-header">Now Airing</h1>
    <div id="active-server-container">
      <!-- Filled dynamically -->
    </div>
  </div>

  <div id="social-links">
    <a href="https://discord.gg/NtXEEJRbH4" target="_blank"><img class="invert-on-dark" src="discord_icon.png" alt="Discord"></a>
    <a href="https://www.twitch.tv/CloudheartTV" target="_blank"><img class="invert-on-dark" src="twitch_icon.png" alt="Twitch"></a>
    <a href="https://www.youtube.com/@CloudheartTV" target="_blank"><img class="invert-on-dark" src="youtube_icon.png" alt="YouTube"></a>
    <a href="https://steamcommunity.com/id/Cloudheart/" target="_blank"><img class="invert-on-dark" src="steam_icon.png" alt="Steam"></a>
  </div>

  <script>
    const servers = [
      { key: 'fallout', label: 'Fallout: Georgia' },
      { key: 'kingmaker', label: 'Kingmaker' },
      { key: 'powderkids', label: 'Powderkids' },
      { key: 'tabra', label: 'TABRA' },
      { key: 'elder-scrolls', label: 'Elder Scrolls: Gaol' }
    ];

    async function checkServerStatus() {
      const apiURL = "https://cloudheartfoundry.duckdns.org/api/status";
      const serverURL = "https://cloudheartfoundry.duckdns.org/";
      const container = document.getElementById("active-server-container");
      const header = document.getElementById("now-airing-header");

      let worldName = await getFoundryWorld(apiURL);
      worldName = worldName.toLowerCase();

      const match = servers.find(server => worldName.includes(server.key));

      if (match) {
        const div = document.createElement("div");
        div.className = `status-container online`;

        div.innerHTML = `
          <a href="${serverURL}" target="_blank">
            <img class="status-image" src="online_${match.key}.png" alt="${match.label} Server">
          </a>
          <p class="status-text">${match.label} Server Online! Click to Join.</p>
        `;

        container.appendChild(div);
      } else {
        // Show fallback: All Servers Offline
        header.innerText = "No Active Server";
        const div = document.createElement("div");
        div.className = `status-container offline`;

        div.innerHTML = `
          <img class="status-image" src="AllServersOffline.png" alt="All Servers Offline">
          <p class="status-text">All servers are currently offline.</p>
        `;

        container.appendChild(div);
      }
    }

    async function getFoundryWorld(url) {
      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error("Foundry API unreachable");
        const jsonData = await response.json();
        return jsonData.world ?? "";
      } catch (error) {
        console.error("Error fetching Foundry API:", error);
        return "";
      }
    }

    checkServerStatus();
  </script>
</body>
</html>
